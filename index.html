<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘의 역사 1분 퀴즈</title>

  <!-- 카카오톡 / SNS 공유용 메타태그 (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://stock-amaster.github.io/daily-history-quiz/">
  <meta property="og:title" content="오늘의 역사 1분 퀴즈 | 내 역사 상식은 몇 점?">
  <meta property="og:description" content="세종대왕 수라상엔 정말 김치가 있었을까? 1분 만에 풀어보는 흥미진진 역사 퀴즈!">
  <meta property="og:image" content="https://images.unsplash.com/photo-1548115184-bc6544d06a58?q=80&w=800&auto=format&fit=crop">

  <!-- 트위터 카드 메타태그 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="오늘의 역사 1분 퀴즈">
  <meta name="twitter:description" content="1분 만에 풀어보는 흥미진진 역사 상식 퀴즈!">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1548115184-bc6544d06a58?q=80&w=800&auto=format&fit=crop">

  <!-- [추후 구글 애드센스 승인용 스크립트 들어갈 자리] -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* 애드센스 배너 컨테이너 */
    .ad-container {
      width: 100%;
      max-width: 440px;
      margin: 12px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 승인 전 자리표시(Placeholder) 박스 */
    .ad-placeholder {
      width: 100%;
      min-height: 80px;
      border: 1px dashed #334155;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-size: 13px;
      background-color: rgba(30, 41, 59, 0.4);
      letter-spacing: -0.3px;
    }

    .quiz-container {
      background-color: #1e293b;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background-color: #0284c7;
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 9999px;
    }

    .progress-text {
      font-size: 14px;
      color: #38bdf8;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: #334155;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    .category-title {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .question-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      color: #f1f5f9;
      margin-top: 4px;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #27354a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background-color: #334155;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background-color: #059669 !important;
      border-color: #34d399 !important;
      color: #ffffff !important;
    }

    .option-btn.wrong {
      background-color: #dc2626 !important;
      border-color: #f87171 !important;
      color: #ffffff !important;
    }

    .explanation-box {
      display: none;
      background-color: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .next-btn {
      display: none;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    /* 결과 카드 스타일 */
    .result-box {
      display: none;
      text-align: center;
      padding: 10px 0;
    }

    .result-score {
      font-size: 42px;
      font-weight: 800;
      color: #38bdf8;
      margin: 10px 0;
    }

    .share-btn {
      background-color: #fee500;
      color: #191919;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- [상단 배너 광고 영역] -->
  <div class="ad-container" id="ad-top">
    <div class="ad-placeholder">
      광고 배너 영역 (상단)
      <!-- 추후 애드센스 승인 시 이 자리에 ins 태그 삽입 -->
    </div>
  </div>

  <div class="quiz-container">
    <div id="quiz-area">
      <div class="top-bar">
        <span class="badge">오늘의 역사 1분</span>
        <span class="progress-text" id="progress-text">1 / 5</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div style="margin-top: 10px;">
        <div class="category-title" id="category-title">사극 고증 탐구</div>
        <div class="question-title" id="question-title">사극에서 세종대왕 수라상에 빨간 배추김치와 매콤한 고추장이 올라왔을까요?</div>
      </div>

      <div class="options-group" id="options-group" style="margin-top: 16px;"></div>

      <div class="explanation-box" id="explanation-box"></div>

      <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 문제 풀기</button>
    </div>

    <!-- 최종 결과 화면 -->
    <div class="result-box" id="result-box">
      <div class="badge" style="display:inline-block; margin-bottom: 8px;">퀴즈 완주!</div>
      <h2 style="font-size: 22px; font-weight: 700;">내 역사 상식 점수는?</h2>
      <div class="result-score" id="final-score">0점</div>
      <p id="result-comment" style="color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 20px;"></p>
      <button class="share-btn" onclick="shareQuiz()">카카오톡으로 친구에게 공유하기</button>
      <button class="next-btn" style="display:block; margin-top: 10px; background: #334155;" onclick="location.reload()">다시 풀기</button>
    </div>
  </div>

  <!-- [하단 배너 광고 영역] -->
  <div class="ad-container" id="ad-bottom">
    <div class="ad-placeholder">
      광고 배너 영역 (하단)
      <!-- 추후 애드센스 승인 시 이 자리에 ins 태그 삽입 -->
    </div>
  </div>

  <script>
    const quizData = [
      {
        category: "사극 고증 탐구",
        question: "사극에서 세종대왕 수라상에 빨간 배추김치와 매콤한 고추장이 올라왔을까요?",
        options: [
          "1. 왕의 밥상이니 당연히 올라왔다",
          "2. 고추는 임진왜란 이후 들어와 당시엔 없었다"
        ],
        answer: 1,
        explanation: "정답은 2번입니다! 고추는 16세기 말 임진왜란 무렵 한반도에 전래되었습니다. 세종대왕 시대의 김치는 고춧가루가 없는 백김치나 절임 채소였습니다."
      },
      {
        category: "생활사 미스터리",
        question: "조선시대 과거시험장에서도 컨닝(부정행위)이 있었을까요?",
        options: [
          "1. 유교 국가라 엄벌에 처해져 전혀 없었다",
          "2. 대리시험, 족보 암기복사 등 온갖 부정행위가 만연했다"
        ],
        answer: 1,
        explanation: "정답은 2번입니다! 조선 후기 과거시험장에는 대리 응시, 답안지 바꿔치기, 벼루 밑 커닝페이퍼 등 상상을 초월하는 부정행위가 심각한 사회 문제였습니다."
      },
      {
        category: "조선 군사 이야기",
        question: "이순신 장군의 거북선 바닥은 평평한 배(평저선)였을까요, 뾰족한 배(첨저선)였을까요?",
        options: [
          "1. 조수간만의 차가 큰 서·남해안 특성상 밑바닥이 평평했다",
          "2. 빠른 기동력을 위해 밑바닥이 V자형으로 뾰족했다"
        ],
        answer: 0,
        explanation: "정답은 1번입니다! 한국 고유의 판옥선과 거북선은 바닥이 평평한 평저선 구조여서 조수간만의 차가 크고 암초가 많은 우리 바다에서 제자리 회전(선회력)과 함포 사격에 매우 유리했습니다."
      },
      {
        category: "궁궐 비밀 이야기",
        question: "조선시대 왕들은 화장실(변소)을 직접 찾아가서 볼일을 보았을까요?",
        options: [
          "1. 궁궐 내 전용 화장실 건물로 행차했다",
          "2. '매화틀'이라는 이동식 변기를 침전으로 가져와 해결했다"
        ],
        answer: 1,
        explanation: "정답은 2번입니다! 왕은 궁궐 화장실로 직접 가지 않고 상궁들이 비단으로 감싼 이동식 변기인 '매화틀'을 가져오면 그곳에 볼일을 보았으며, 내의원 의관들이 대변의 색과 맛을 살펴 건강을 체크했습니다."
      },
      {
        category: "조선의 경제와 식문화",
        question: "조선시대 사람들은 지금 현대인보다 밥을 훨씬 적게 먹었을까요?",
        options: [
          "1. 하루 세끼 현대인의 2~3배에 달하는 대용량 고봉밥을 먹었다",
          "2. 식량이 부족하여 지금 현대인 공깃밥의 절반 정도만 먹었다"
        ],
        answer: 0,
        explanation: "정답은 1번입니다! 조선시대 성인의 1끼 밥그릇(사발)은 약 400~500g 수준으로 현재 즉석밥(210g)의 두 배가 넘었습니다. 고기나 지방 섭취가 적어 주식인 탄수화물로 에너지를 채웠기 때문입니다."
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let isAnswered = false;

    function renderQuestion() {
      isAnswered = false;
      const data = quizData[currentIdx];

      document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${quizData.length}`;
      document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
      document.getElementById('category-title').innerText = data.category;
      document.getElementById('question-title').innerText = data.question;

      const optionsGroup = document.getElementById('options-group');
      optionsGroup.innerHTML = '';

      data.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.onclick = () => selectOption(index, btn);
        optionsGroup.appendChild(btn);
      });

      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(selectedIndex, btnElement) {
      if (isAnswered) return;
      isAnswered = true;

      const data = quizData[currentIdx];
      const buttons = document.querySelectorAll('.option-btn');

      if (selectedIndex === data.answer) {
        btnElement.classList.add('correct');
        score += 20;
      } else {
        btnElement.classList.add('wrong');
        buttons[data.answer].classList.add('correct');
      }

      const expBox = document.getElementById('explanation-box');
      expBox.innerText = data.explanation;
      expBox.style.display = 'block';

      const nextBtn = document.getElementById('next-btn');
      if (currentIdx === quizData.length - 1) {
        nextBtn.innerText = "결과 보러 가기";
      } else {
        nextBtn.innerText = "다음 문제 풀기";
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < quizData.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-area').style.display = 'none';
      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';

      document.getElementById('final-score').innerText = `${score}점`;

      let comment = "";
      if (score === 100) comment = "대단합니다! 조선시대에 태어났다면 장원급제 감이네요!";
      else if (score >= 60) comment = "훌륭합니다! 웬만한 사극 매니아 수준의 역사 상식을 갖추셨군요.";
      else comment = "아쉬워요! 하지만 이제 제대로 된 역사 상식을 알게 되셨습니다!";

      document.getElementById('result-comment').innerText = comment;
    }

    function shareQuiz() {
      if (navigator.share) {
        navigator.share({
          title: '오늘의 역사 1분 퀴즈',
          text: `내 역사 상식 점수는 ${score}점입니다! 당신도 한번 도전해보세요!`,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('퀴즈 주소가 복사되었습니다! 카카오톡 대화방에 붙여넣어 공유하세요.');
      }
    }

    // 초기 실행
    renderQuestion();
  </script>
</body>
</html>
