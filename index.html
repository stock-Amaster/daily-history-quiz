<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>조선 과거시험: 8도 영토 정복기</title>
  
  <meta property="og:title" content="조선 과거시험: 전국 8도 역사 정복전">
  <meta property="og:description" content="700문항을 모두 격파하고 천하통일 영의정에 등극하라!">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg-color: #f7f3e8;
      --paper-color: #fffef9;
      --ink-color: #2c251e;
      --border-color: #8c7355;
      --point-color: #b22222;
      --gold-color: #d4af37;
      --accent-color: #3f6844;
      --font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--ink-color);
      font-family: var(--font-family);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--paper-color);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    h1 {
      font-size: 1.35rem;
      color: var(--point-color);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .rank-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
      padding: 10px 12px;
      background: #f1ede2;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: bold;
    }

    .rank-bar-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .rank-badge {
      color: var(--point-color);
      display: inline-block;
      padding: 2px 8px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #ddd5c7;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d4af37, #b22222);
      transition: width 0.3s ease;
    }

    .map-status-card {
      background: var(--paper-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
    }

    .map-status-title {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .province-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .p-tag {
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
      border: 1px solid #ccc;
      color: #999;
      background: #fafafa;
      transition: all 0.2s ease;
    }

    .p-tag.conquered {
      border-color: var(--point-color);
      background: #ffe8e8;
      color: var(--point-color);
      font-weight: bold;
      box-shadow: 0 1px 3px rgba(178,34,34,0.2);
    }

    .quiz-card {
      background: var(--paper-color);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
      position: relative;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: #777;
    }

    .quiz-category {
      background: var(--border-color);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: bold;
    }

    .quiz-question {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 18px;
      color: #1a1a1a;
      word-break: keep-all;
    }

    .hint-container {
      margin-bottom: 16px;
      display: none;
    }

    .btn-hint {
      background: #fbf7ee;
      border: 1px dashed var(--border-color);
      color: #8c7355;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      width: 100%;
      justify-content: center;
    }

    .hint-content {
      display: none;
      margin-top: 8px;
      padding: 10px;
      background: #fdf6e2;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #634a00;
      border-left: 3px solid #d4af37;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-option {
      background: #fff;
      border: 2px solid #dcd3c1;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink-color);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-option:active {
      transform: scale(0.98);
    }

    .btn-option.correct {
      background: #e8f5e9 !important;
      border-color: #2e7d32 !important;
      color: #1b5e20 !important;
    }

    .btn-option.wrong {
      background: #ffebee !important;
      border-color: #c62828 !important;
      color: #b71c1c !important;
    }

    .explanation-box {
      margin-top: 16px;
      padding: 14px;
      background: #f9f6ed;
      border-left: 4px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
      word-break: keep-all;
    }

    .btn-next {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background: var(--point-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: var(--paper-color);
      border: 3px solid var(--point-color);
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.4rem;
      color: var(--point-color);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .score-summary {
      font-size: 1.05rem;
      margin: 14px 0;
      font-weight: bold;
    }

    .rank-up-alert {
      background: #fff8e1;
      border: 1px solid #ffd54f;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      color: #8d6e63;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-hipass {
      background: #1e272e;
      color: #ffd32a;
      border: 2px solid #ffd32a;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }

    .btn-hipass:active {
      transform: scale(0.98);
    }

    .btn-retry {
      background: #c0392b;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-share {
      background: #fae100;
      color: #371d1e;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    .loader {
      text-align: center;
      padding: 40px;
      font-weight: bold;
      color: #777;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📜 조선 과거시험: 영토 평정전</h1>
    <div class="rank-bar">
      <div class="rank-bar-row">
        <div>현재 품계: <span id="user-rank" class="rank-badge">종9품 참봉</span></div>
        <div>총점: <span id="user-score" style="color:var(--point-color);">0</span>점</div>
      </div>
      <div class="rank-bar-row" style="font-size:0.8rem; color:#666;">
        <span>완주 진도: <strong id="progress-count" style="color:#2c251e;">0</strong> / <span id="total-q-count">700</span>문항</span>
        <span id="progress-percent" style="font-weight:bold; color:var(--point-color);">0.0%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>
  </header>

  <div class="map-status-card">
    <div class="map-status-title">
      <span>🗺️ 전국 8도 평정 상태</span>
      <span id="conquered-count" style="color: var(--point-color);">0 / 8도 평정</span>
    </div>
    <div class="province-tags" id="province-list">
      <span class="p-tag" data-p="0">경기도</span>
      <span class="p-tag" data-p="1">충청도</span>
      <span class="p-tag" data-p="2">전라도</span>
      <span class="p-tag" data-p="3">경상도</span>
      <span class="p-tag" data-p="4">강원도</span>
      <span class="p-tag" data-p="5">황해도</span>
      <span class="p-tag" data-p="6">평안도</span>
      <span class="p-tag" data-p="7">함경도</span>
    </div>
  </div>

  <div class="quiz-card" id="quiz-box">
    <div id="loading" class="loader">구글 시트에서 문제은행을 불러오는 중...</div>
    
    <div id="quiz-content" style="display: none;">
      <div class="quiz-meta">
        <span class="quiz-category" id="q-category">분류</span>
        <span id="q-progress">문항 1 / 5</span>
      </div>

      <div class="quiz-question" id="q-text">질문이 여기에 표시됩니다.</div>

      <div class="hint-container" id="hint-wrapper">
        <button class="btn-hint" onclick="toggleHint()">
          📜 암행어사 밀서 (난이도 3 특별 힌트 보기)
        </button>
        <div class="hint-content" id="hint-text"></div>
      </div>

      <div class="options-grid">
        <button class="btn-option" onclick="selectAnswer(1)">
          <span id="opt-1-text">보기 1</span>
        </button>
        <button class="btn-option" onclick="selectAnswer(2)">
          <span id="opt-2-text">보기 2</span>
        </button>
      </div>

      <div class="explanation-box" id="explanation"></div>

      <button class="btn-next" id="next-btn" onclick="nextQuestion()">다음 문항으로 ➜</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="result-modal">
  <div class="modal-content">
    <div class="modal-title" id="modal-title">🏁 과거시험 채점 결과</div>
    <div class="score-summary" id="modal-score-text">5문제 중 3문제 급제!</div>
    <div class="rank-up-alert" id="modal-rank-alert">축하합니다! 새로운 관직에 제수되었습니다.</div>
    
    <div class="modal-actions">
      <button class="btn-hipass" id="hipass-btn" onclick="continueHiPass()">
        ⚡ 쉼 없는 과거시험 (합격! 다음 5문제 진격)
      </button>

      <button class="btn-retry" id="retry-btn" onclick="retryBatch()" style="display: none;">
        🔄 낙방이오! 재시 치르기 (새로운 5문제로 재도전)
      </button>

      <button class="btn-share" onclick="shareQuiz()">
        📢 시험지 카톡 공유하고 친구와 겨루기
      </button>
    </div>
  </div>
</div>

<script>
  // 지연 없는 구글 시트 공식 직접 내보내기 주소 적용
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1iPe9ldyjdfPbY6xF29aiOpfCVw_qIU3R4ZfyDCHdiHs/export?format=csv&gid=0";
  const LOG_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyBxph1RhHUGhm9As0CVx5xmZooki5HmcuKfEZIZPXxajEUHpXlR8h24luDHmSNkTR/exec";

  const RANKS = [
    { ratio: 0.00, title: "평민 (과거 준비생)" },
    { ratio: 0.05, title: "종9품 참봉" },
    { ratio: 0.12, title: "정8품 사서" },
    { ratio: 0.22, title: "종7품 박사" },
    { ratio: 0.35, title: "정6품 전적" },
    { ratio: 0.50, title: "정5품 홍문관 교리" },
    { ratio: 0.65, title: "종4품 서해도 군수" },
    { ratio: 0.78, title: "정3품 당상관 동부승지" },
    { ratio: 0.88, title: "종2품 경기 관찰사" },
    { ratio: 0.95, title: "정2품 판서" },
    { ratio: 1.00, title: "정1품 영의정 (천하통일)" }
  ];

  let allQuestions = [];
  let currentBatch = [];
  let currentIndex = 0;
  let batchCorrectCount = 0;
  let batchWrongQuestions = [];
  let totalScore = parseInt(localStorage.getItem('user_history_score') || '0');
  let solvedIndexes = new Set(JSON.parse(localStorage.getItem('solved_indices') || '[]'));
  let totalExamCount = parseInt(localStorage.getItem('user_exam_count') || '0');
  let audioCtx = null;

  let userUniqueId = localStorage.getItem('user_unique_id');
  if (!userUniqueId) {
    userUniqueId = '선비_' + Math.random().toString(36).substring(2, 8).toUpperCase();
    localStorage.setItem('user_unique_id', userUniqueId);
  }

  function playFanfare(isSuccess) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      if (isSuccess) {
        [330, 392, 440, 523, 659].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);
          gain.gain.setValueAtTime(0.2, now + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.6);
        });
      } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    } catch(e) {}
  }

  async function initData() {
    try {
      const cacheBuster = (SHEET_CSV_URL.includes("?") ? "&" : "?") + "_t=" + Date.now();
      const response = await fetch(SHEET_CSV_URL + cacheBuster);
      if (!response.ok) throw new Error("네트워크 응답 오류");
      const csvText = await response.text();
      parseCSV(csvText);

      if (allQuestions.length === 0) {
        loadFallbackQuestions();
      }

      document.getElementById('total-q-count').innerText = allQuestions.length;
      updateProfileUI();
      startNewBatch();
    } catch (err) {
      console.warn("시트 연동 대기 중 기본 문제 탑재", err);
      loadFallbackQuestions();
      document.getElementById('total-q-count').innerText = allQuestions.length;
      updateProfileUI();
      startNewBatch();
    }
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/);
    allQuestions = [];

    for (let i = 1; i < lines.length; i++) {
      const row = lines[i];
      if (!row || !row.trim()) continue;

      let cols = [];
      if (row.includes('	')) {
        cols = row.split('	');
      } else {
        cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      }

      cols = cols.map(c => c ? c.replace(/^"|"$/g, '').trim() : '');

      if (cols.length >= 5 && cols[1]) {
        allQuestions.push({
          category: cols[0] || '역사 일반',
          question: cols[1],
          opt1: cols[2],
          opt2: cols[3],
          ans: parseInt(cols[4]) || 1,
          explanation: cols[5] || '상세 해설이 등록되어 있지 않습니다.',
          level: parseInt(cols[6]) || 1,
          qNum: i
        });
      }
    }
  }

  function loadFallbackQuestions() {
    allQuestions = [
      { category: '조선 왕실', question: '조선시대 왕의 얼굴을 그린 초상화를 부르던 공식 명칭은?', opt1: '어진', opt2: '의궤', ans: 1, explanation: '왕의 얼굴은 어진(御眞)이라 칭하며 도화서 화원이 그렸습니다.', level: 1, qNum: 1 },
      { category: '삼국 영웅', question: '고구려 광개토대왕이 우리나라 최초로 독자 사용한 연호는?', opt1: '영락', opt2: '건원', ans: 1, explanation: '영원한 즐거움을 뜻하는 영락(永樂) 연호를 사용하여 천하관을 선포했습니다.', level: 2, qNum: 2 },
      { category: '고려 왕조', question: '고려 숙종 때 은 한 근으로 한반도 지형을 본떠 만든 고액 은돈은?', opt1: '활구(은병)', opt2: '상평통보', ans: 1, explanation: '입구가 넓은 호병 모양의 활구는 귀족 관료들의 고액 거래용 은돈이었습니다.', level: 3, qNum: 3 },
      { category: '조선 과학', question: '조선 세종 때 장영실 등이 제작한 해시계의 이름은?', opt1: '앙부일구', opt2: '자격루', ans: 1, explanation: '가마솥 모양의 해시계는 앙부일구(仰釜日晷)입니다. 자격루는 물시계입니다.', level: 1, qNum: 4 },
      { category: '조선 제도', question: '조선시대 지방 수령을 감찰하고 행정을 감독하던 최고 지방관은?', opt1: '관찰사(감사)', opt2: '암행어사', ans: 1, explanation: '8도에 파견된 최고 책임 관원은 종2품 관찰사(관찰사 겸 감사)였습니다.', level: 2, qNum: 5 }
    ];
  }

  function startNewBatch() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('quiz-content').style.display = 'block';

    let available = allQuestions.filter(q => !solvedIndexes.has(q.qNum));

    if (available.length < 5) {
      alert("🎉 장원급제! 조선 과거시험 준비된 모든 문제를 완파하셨습니다. 문제를 처음부터 다시 섞습니다.");
      solvedIndexes.clear();
      localStorage.removeItem('solved_indices');
      available = [...allQuestions];
    }

    available.sort(() => 0.5 - Math.random());
    currentBatch = available.slice(0, 5);

    currentIndex = 0;
    batchCorrectCount = 0;
    batchWrongQuestions = [];
    renderQuestion();
  }

  function renderQuestion() {
    const q = currentBatch[currentIndex];
    document.getElementById('q-category').innerText = q.category;
    document.getElementById('q-progress').innerText = `문항 ${currentIndex + 1} / 5`;
    document.getElementById('q-text').innerText = q.question;

    // 보기 1과 보기 2를 50% 확률로 무작위 셔플 (1번 정답 쏠림 방지)
    const isFlipped = Math.random() < 0.5;
    if (isFlipped) {
      document.getElementById('opt-1-text').innerText = q.opt2;
      document.getElementById('opt-2-text').innerText = q.opt1;
      q.currentScreenAns = (q.ans === 1) ? 2 : 1;
    } else {
      document.getElementById('opt-1-text').innerText = q.opt1;
      document.getElementById('opt-2-text').innerText = q.opt2;
      q.currentScreenAns = q.ans;
    }

    const hintWrapper = document.getElementById('hint-wrapper');
    const hintText = document.getElementById('hint-text');
    hintText.style.display = 'none';

    if (q.level === 3) {
      hintWrapper.style.display = 'block';
      const hintSummary = q.explanation.split('.')[0] + '...';
      hintText.innerText = `💡 [암행어사 밀서]: ${hintSummary}`;
    } else {
      hintWrapper.style.display = 'none';
    }

    const btns = document.querySelectorAll('.btn-option');
    btns.forEach(b => {
      b.className = 'btn-option';
      b.disabled = false;
    });

    document.getElementById('explanation').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
  }

  function toggleHint() {
    const hintText = document.getElementById('hint-text');
    hintText.style.display = (hintText.style.display === 'block') ? 'none' : 'block';
  }

  function selectAnswer(userPick) {
    const q = currentBatch[currentIndex];
    const btns = document.querySelectorAll('.btn-option');
    btns.forEach(b => b.disabled = true);

    const correctScreenAns = q.currentScreenAns || q.ans;
    const isCorrect = (userPick === correctScreenAns);
    playFanfare(isCorrect);

    if (isCorrect) {
      btns[userPick - 1].classList.add('correct');
      totalScore += 10;
      batchCorrectCount++;
    } else {
      btns[userPick - 1].classList.add('wrong');
      btns[correctScreenAns - 1].classList.add('correct');
      batchWrongQuestions.push(`Q${q.qNum}`);
    }

    solvedIndexes.add(q.qNum);
    localStorage.setItem('solved_indices', JSON.stringify(Array.from(solvedIndexes)));
    localStorage.setItem('user_history_score', totalScore.toString());

    const expBox = document.getElementById('explanation');
    expBox.innerHTML = `<strong>${isCorrect ? '✅ 급제 (정답)!' : '❌ 낙방 (오답)!'}</strong><br>${q.explanation}`;
    expBox.style.display = 'block';

    updateProfileUI();

    const nextBtn = document.getElementById('next-btn');
    if (currentIndex < 4) {
      nextBtn.innerText = "다음 문제 풀기 ➜";
    } else {
      nextBtn.innerText = "🏁 채점 결과 및 과거 급제 확인";
    }
    nextBtn.style.display = 'block';
  }

  function nextQuestion() {
    if (currentIndex < 4) {
      currentIndex++;
      renderQuestion();
    } else {
      showResultModal();
    }
  }

  function showResultModal() {
    totalExamCount++;
    localStorage.setItem('user_exam_count', totalExamCount.toString());

    const modal = document.getElementById('result-modal');
    const modalTitle = document.getElementById('modal-title');
    const scoreText = document.getElementById('modal-score-text');
    const rankAlert = document.getElementById('modal-rank-alert');
    const hipassBtn = document.getElementById('hipass-btn');
    const retryBtn = document.getElementById('retry-btn');

    const totalQ = allQuestions.length || 700;
    const progressRatio = solvedIndexes.size / totalQ;
    const rankObj = getRankTitle(progressRatio);

    sendResultToGoogleSheet(batchCorrectCount, rankObj.title, solvedIndexes.size, totalQ, batchWrongQuestions, totalExamCount);

    if (batchCorrectCount >= 3) {
      modalTitle.innerText = "🎉 축 급제! 진격 성공";
      modalTitle.style.color = "var(--point-color)";
      scoreText.innerHTML = `5문제 중 <strong>${batchCorrectCount}문제</strong> 급제! (+${batchCorrectCount * 10}점 획득)`;
      rankAlert.innerHTML = `현재 관직: <strong>${rankObj.title}</strong><br>누적 정복 진도: <strong>${solvedIndexes.size} / ${totalQ}문항</strong> (${(progressRatio * 100).toFixed(1)}%)`;
      
      hipassBtn.style.display = 'flex';
      retryBtn.style.display = 'none';
    } else {
      modalTitle.innerText = "⚠️ 과락 낙방! 진격 차단";
      modalTitle.style.color = "#c0392b";
      scoreText.innerHTML = `5문제 중 <strong>${batchCorrectCount}문제</strong> 급제 (과락)<br><span style="font-size:0.85rem; color:#7f8c8d;">최소 3문제 이상 맞혀야 다음으로 진격할 수 있소.</span>`;
      rankAlert.innerHTML = `현재 관직: <strong>${rankObj.title}</strong><br>학문 수양이 부족하니 재시를 치르시오!`;
      
      hipassBtn.style.display = 'none';
      retryBtn.style.display = 'flex';
    }

    modal.style.display = 'flex';
  }

  function sendResultToGoogleSheet(correctCount, rank, solvedCount, totalQ, wrongArr, examCount) {
    if (!LOG_SCRIPT_URL) return;

    try {
      const progressText = `${solvedCount}/${totalQ}제 (${((solvedCount/totalQ)*100).toFixed(1)}%)`;
      const wrongText = wrongArr.length > 0 ? wrongArr.join(', ') : '없음(만점)';

      const params = new URLSearchParams({
        userId: userUniqueId,
        progressRatio: progressText,
        batchResult: `${correctCount}/5 (${correctCount >= 3 ? '급제' : '과락'})`,
        wrongQuestions: wrongText,
        rankTitle: rank,
        sessionCount: `${examCount}회차`,
        _t: new Date().getTime()
      });

      const pingImg = new Image();
      pingImg.src = `${LOG_SCRIPT_URL}?${params.toString()}`;
    } catch (err) {
      console.log("전송 로그:", err);
    }
  }

  function continueHiPass() {
    document.getElementById('result-modal').style.display = 'none';
    startNewBatch();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function retryBatch() {
    document.getElementById('result-modal').style.display = 'none';
    startNewBatch();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function shareQuiz() {
    const totalQ = allQuestions.length || 700;
    const progressRatio = solvedIndexes.size / totalQ;
    const rankTitle = getRankTitle(progressRatio).title;

    const shareText = `[조선 과거시험] 나의 관직은 '${rankTitle}' (${solvedIndexes.size}문항 격파)! 700문제를 모두 풀고 천하통일 영의정에 도전해보시오!`;
    if (navigator.share) {
      navigator.share({
        title: '조선 과거시험: 영토 평정전',
        text: shareText,
        url: window.location.href
      }).catch(() => {});
    } else {
      navigator.clipboard.writeText(`${shareText}
${window.location.href}`).then(() => {
        alert("시험지 링크가 복사되었습니다. 단톡방에 붙여넣어 겨뤄보세요!");
      });
    }
  }

  function updateProfileUI() {
    const totalQ = allQuestions.length || 700;
    const solvedCount = solvedIndexes.size;
    const progressRatio = Math.min(1.0, solvedCount / totalQ);

    document.getElementById('user-score').innerText = totalScore;
    document.getElementById('progress-count').innerText = solvedCount;
    document.getElementById('progress-percent').innerText = `${(progressRatio * 100).toFixed(1)}%`;
    document.getElementById('progress-fill').style.width = `${progressRatio * 100}%`;

    const rank = getRankTitle(progressRatio);
    document.getElementById('user-rank').innerText = rank.title;

    const conquered = Math.min(8, Math.floor(progressRatio * 8));
    document.getElementById('conquered-count').innerText = `${conquered} / 8도 평정`;

    const tags = document.querySelectorAll('.p-tag');
    tags.forEach((tag, idx) => {
      if (idx < conquered) {
        tag.classList.add('conquered');
      } else {
        tag.classList.remove('conquered');
      }
    });
  }

  function getRankTitle(ratio) {
    let current = RANKS[0];
    for (let r of RANKS) {
      if (ratio >= r.ratio) current = r;
      else break;
    }
    return current;
  }

  window.addEventListener('DOMContentLoaded', initData);
</script>
</body>
</html>
