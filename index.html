      align-items: center;
    }

    .round-tag {

    }

    .progress-text {

    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: #334155;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {

      width: 0%;

      text-align: center;
    }

      from { transform: scaleY(0.1); opacity: 0; }

    .edict-header {
      font-size: 18px;
      font-weight: 900;

      max-width: 280px;
      margin: 0 auto;
      display: flex;
      justify-content: center;

      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1.5;
      transition: all 0.4s ease;
    }

    .province-path.conquered {
      fill: #0284c7;
      stroke: #38bdf8;
      stroke-width: 2;

      stroke: #fbbf24 !important;
    }

      font-size: 10px;
      font-weight: 800;
      fill: #64748b;
      pointer-events: none;
      transition: all 0.3s;
    }

    .province-label.conquered {

    }

      display: none;
      font-size: 13px;

      display: block;
      animation: flagPop 0.4s ease-out;

      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      line-height: 1.45;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
  </style>

    const QUIZ_COUNT = 5;

    const STORAGE_SOLVED = "history_mastered_ids";
    const STORAGE_EXP = "history_user_exp";
    const STORAGE_DAILY_DATE = "history_last_quiz_date";
    const STORAGE_DAILY_STAGE = "history_daily_stage";
    const STORAGE_LAST_SCORE = "history_last_score";

    let quizData = [];
    let currentIdx = 0;
    let score = 0;
    let isAnswered = false;
    let totalQuestionsCount = 0;
    let initialExp = 0;
    let currentPlayStage = 'base';

    // 품계별 관할 영토 매핑 정의
    const RANKS = [
      { id: 10, minExp: 500, tag: "전설", title: "조선 국왕", duty: "실록의 주인공 (만렙)", territories: ['gyeonggi','gangwon','chungcheong','jeolla','gyeongsang','hwanghae','pyongan','hamgyong'], capital: 'gyeonggi', desc: "팔도강산 완전 통치" },
      { id: 9,  minExp: 380, tag: "정1품", title: "영의정", duty: "일인지하 만인지상", territories: ['gyeonggi','gangwon','chungcheong','jeolla','gyeongsang','hwanghae','pyongan'], capital: 'gyeonggi', desc: "7도 행정 총괄" },
      { id: 8,  minExp: 270, tag: "정2품", title: "이조판서", duty: "조정의 으뜸 대신", territories: ['gyeonggi','gangwon','chungcheong','jeolla','gyeongsang','hwanghae'], capital: 'gyeonggi', desc: "중원 6도 관할" },
      { id: 7,  minExp: 190, tag: "정3품", title: "당상관 목사", duty: "붉은 단령 착용", territories: ['gyeonggi','chungcheong','jeolla','gyeongsang'], capital: 'gyeongsang', desc: "남부 삼남 및 경기 관할" },
      { id: 6,  minExp: 130, tag: "종4품", title: "나주 군수", duty: "고을의 목민관 사또", territories: ['gyeonggi','chungcheong','jeolla'], capital: 'jeolla', desc: "호남 나주목 관할" },
      { id: 5,  minExp: 85,  tag: "종6품", title: "지평 / 훈도", duty: "중견 실무 관원", territories: ['gyeonggi','chungcheong'], capital: 'chungcheong', desc: "호서 관할" },
      { id: 4,  minExp: 50,  tag: "종7품", title: "규장각 박사", duty: "정식 관복 착용", territories: ['gyeonggi','gangwon'], capital: 'gangwon', desc: "경기·강원 관할" },
      { id: 3,  minExp: 25,  tag: "종9품", title: "권지 (실습관)", duty: "첫 관직 등청", territories: ['gyeonggi'], capital: 'gyeonggi', desc: "한양 조정 등청" },
      { id: 2,  minExp: 10,  tag: "유생", title: "성균관 진사", duty: "소과 급제 한양 입성", territories: ['gyeonggi'], capital: 'gyeonggi', desc: "한양 성균관 유학" },
      { id: 1,  minExp: 3,   tag: "유생", title: "서당 훈도생", duty: "천자문 완독", territories: [], capital: null, desc: "과거 공부 중" },
      { id: 0,  minExp: 0,   tag: "백성", title: "초야의 백성", duty: "과거 준비생", territories: [], capital: null, desc: "미개척 안개 상태" }
    ];

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    function getRank(exp) {
      return RANKS.find(r => exp >= r.minExp) || RANKS[RANKS.length - 1];
    }

    function getRankById(id) {
      return RANKS.find(r => r.id === parseInt(id, 10)) || RANKS[RANKS.length - 1];
    }

    function updateProfileUI() {
      const exp = parseInt(localStorage.getItem(STORAGE_EXP) || "0", 10);
      const rank = getRank(exp);
      document.getElementById('user-rank-tag').innerText = rank.tag;
      document.getElementById('user-title').innerText = rank.title;
      document.getElementById('user-duty-text').innerText = rank.duty;
    }

    // [하이브리드 시각화] 품계에 따른 조선 8도 렌더링
    function renderJoseonMap(rank) {
      const allTerritories = ['hamgyong', 'pyongan', 'hwanghae', 'gangwon', 'gyeonggi', 'chungcheong', 'gyeongsang', 'jeolla'];
      
      // 초기화
      allTerritories.forEach(t => {
        const path = document.getElementById(`p-${t}`);
        const text = document.getElementById(`t-${t}`);
        if (path) path.className.baseVal = "province-path";
        if (text) text.className.baseVal = "province-label";
      });

      // 점령된 영토에 불 켜기
      rank.territories.forEach(t => {
        const path = document.getElementById(`p-${t}`);
        const text = document.getElementById(`t-${t}`);
        if (path) {
          path.classList.add('conquered');
          if (t === rank.capital) path.classList.add('capital');
        }
        if (text) text.classList.add('conquered');
      });

      document.getElementById('map-status-text').innerText = `${rank.territories.length}/8도 장악`;
      document.getElementById('map-assigned-text').innerHTML = `📍 <strong>현재 관할권:</strong> [${rank.title}] ${rank.desc}`;
    }

    function checkInvitedChallenge() {
      const params = new URLSearchParams(window.location.search);
      const rankId = params.get('r');
      const challengerScore = params.get('s');

      if (rankId !== null) {
        const challenger = getRankById(rankId);
        const scoreText = (challengerScore && challengerScore !== "0") ? `${challengerScore}점` : '우수한 성적';
        const banner = document.getElementById('challenge-banner');
        banner.innerHTML = `⚔️ <strong>[${challenger.tag} ${challenger.title}]</strong>의 도전장이 도착했습니다!<br>그의 점수(${scoreText})를 꺾고 더 넓은 영토를 평정하십시오!`;
        banner.style.display = 'block';
      }
    }

    function playFanfareSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const notes = [
          { f: 261.63, start: 0.0, dur: 0.18 },
          { f: 329.63, start: 0.2, dur: 0.18 },
          { f: 392.00, start: 0.4, dur: 0.22 },
          { f: 523.25, start: 0.65, dur: 0.6 }
        ];

        notes.forEach(n => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(n.f, ctx.currentTime + n.start);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + n.start);
          gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + n.start + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.start + n.dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + n.start);
          osc.stop(ctx.currentTime + n.start + n.dur);
        });

        const drumOsc = ctx.createOscillator();
        const drumGain = ctx.createGain();
        drumOsc.frequency.setValueAtTime(110, ctx.currentTime + 0.65);
        drumOsc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 1.2);
        drumGain.gain.setValueAtTime(0.5, ctx.currentTime + 0.65);
        drumGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.3);
        drumOsc.connect(drumGain);
        drumGain.connect(ctx.destination);
        drumOsc.start(ctx.currentTime + 0.65);
        drumOsc.stop(ctx.currentTime + 1.3);
      } catch (e) {}
    }

    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentVal.trim());
          if (currentRow.some(col => col.length > 0)) rows.push(currentRow);
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal.length > 0 || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(col => col.length > 0)) rows.push(currentRow);
      }
      return rows;
    }

    async function fetchQuizFromSheet() {
      checkInvitedChallenge();

      const today = getTodayString();
      const lastDate = localStorage.getItem(STORAGE_DAILY_DATE);
      const stage = localStorage.getItem(STORAGE_DAILY_STAGE);

      if (lastDate !== today) {
        localStorage.setItem(STORAGE_DAILY_DATE, today);
        localStorage.setItem(STORAGE_DAILY_STAGE, 'ready');
        currentPlayStage = 'base';
      } else {
        if (stage === 'bonus_unlocked') {
          currentPlayStage = 'bonus';
          document.getElementById('round-mode-tag').innerText = "보너스 특별시험 (2차)";
        } else if (stage === 'base_done' || stage === 'bonus_done') {
          showAlreadyDoneScreen(stage);
          return;
        }
      }

      initialExp = parseInt(localStorage.getItem(STORAGE_EXP) || "0", 10);
      updateProfileUI();

      try {
        const response = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const allQuestions = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 5) continue;

          const category = row[0] || "역사 상식";
          const question = row[1];
          const opt1 = row[2];
          const opt2 = row[3];
          const answerNum = parseInt(row[4], 10);
          const explanation = row[5] || "";

          if (question && opt1 && opt2 && (answerNum === 1 || answerNum === 2)) {
            allQuestions.push({
              id: question.trim(),
              category: category,
              question: question,
              options: [opt1, opt2],
              answer: answerNum - 1,
              explanation: explanation
            });
          }
        }

        totalQuestionsCount = allQuestions.length;
        if (totalQuestionsCount === 0) throw new Error("문제 없음");

        const mastered = JSON.parse(localStorage.getItem(STORAGE_SOLVED) || "[]");
        let pool = allQuestions.filter(q => !mastered.includes(q.id));

        if (pool.length === 0) {
          localStorage.removeItem(STORAGE_SOLVED);
          pool = allQuestions;
        }

        pool.sort(() => Math.random() - 0.5);
        quizData = pool.slice(0, Math.min(QUIZ_COUNT, pool.length));

        renderQuestion();
      } catch (err) {
        document.getElementById('category-title').innerText = "안내";
        document.getElementById('question-title').innerText = "문제를 불러오는 중입니다. 잠시 후 다시 접속해 주세요.";
      }
    }

    function showAlreadyDoneScreen(stage) {
      updateProfileUI();
      document.getElementById('quiz-area').style.display = 'none';
      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';

      const exp = parseInt(localStorage.getItem(STORAGE_EXP) || "0", 10);
      const currentRank = getRank(exp);
      renderJoseonMap(currentRank);

      const savedScore = localStorage.getItem(STORAGE_LAST_SCORE);
      document.getElementById('final-score').innerText = (savedScore && savedScore !== "0") ? `${savedScore}점` : "통과";
      document.getElementById('result-comment').innerText = "오늘 준비된 과거시험을 이미 치르셨습니다!";
      
      const masteredCount = JSON.parse(localStorage.getItem(STORAGE_SOLVED) || "[]").length;
      document.getElementById('review-info').innerHTML = `💡 총 누적 통과: <strong>${masteredCount}문항</strong>`;

      if (stage === 'base_done') {
        document.getElementById('bonus-action-area').style.display = 'block';
      } else {
        document.getElementById('daily-complete-area').style.display = 'block';
      }
    }

    function renderQuestion() {
      isAnswered = false;
      const data = quizData[currentIdx];

      document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${quizData.length}`;
      document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
      document.getElementById('category-title').innerText = data.category;
      document.getElementById('question-title').innerText = data.question;

      const optionsGroup = document.getElementById('options-group');
      optionsGroup.innerHTML = '';

      data.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${index + 1}. ${optText}`;
        btn.onclick = () => selectOption(index, btn);
        optionsGroup.appendChild(btn);
      });

      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(selectedIndex, btnElement) {
      if (isAnswered) return;
      isAnswered = true;

      const data = quizData[currentIdx];
      const buttons = document.querySelectorAll('.option-btn');
      const pointPerQuestion = Math.round(100 / quizData.length);

      if (selectedIndex === data.answer) {
        btnElement.classList.add('correct');
        score += pointPerQuestion;

        const mastered = JSON.parse(localStorage.getItem(STORAGE_SOLVED) || "[]");
        if (!mastered.includes(data.id)) {
          mastered.push(data.id);
          localStorage.setItem(STORAGE_SOLVED, JSON.stringify(mastered));
        }

        let exp = parseInt(localStorage.getItem(STORAGE_EXP) || "0", 10);
        localStorage.setItem(STORAGE_EXP, exp + 1);
      } else {
        btnElement.classList.add('wrong');
        buttons[data.answer].classList.add('correct');
      }

      updateProfileUI();

      const expBox = document.getElementById('explanation-box');
      expBox.innerText = data.explanation;
      expBox.style.display = 'block';

      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerText = (currentIdx === quizData.length - 1) ? "과거 결과 보러 가기" : "다음 문제 풀기";
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < quizData.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-area').style.display = 'none';
      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';

      if (score > 100) score = 100;
      document.getElementById('final-score').innerText = `${score}점`;
      localStorage.setItem(STORAGE_LAST_SCORE, score.toString());

      const currentExp = parseInt(localStorage.getItem(STORAGE_EXP) || "0", 10);
      const oldRank = getRank(initialExp);
      const newRank = getRank(currentExp);

      // 미니 지도 렌더링
      renderJoseonMap(newRank);

      if (newRank.title !== oldRank.title) {
        playFanfareSound();
        const edictBox = document.getElementById('royal-edict');
        const edictText = document.getElementById('edict-text');
        edictText.innerHTML = `수험생은 역사 상식에 통달하였으므로,<br>이에 <strong>[${newRank.tag}] ${newRank.title}</strong>에 제수(除授)하며<br><strong>[${newRank.desc}]</strong>의 영토 권한을 부여하노라!`;
        edictBox.style.display = 'block';
      }

      let comment = "";
      if (score === 100) comment = "장원급제입니다! 틀린 문제 없이 완벽하게 통과하셨습니다.";
      else if (score >= 60) comment = "선방하셨습니다! 틀린 문제는 다음 판에 복습 문제로 다시 출제됩니다.";
      else comment = "낙방의 고배를 마셨군요. 내일 다시 도전하여 품계를 높여보세요!";

      document.getElementById('result-comment').innerText = comment;

      const masteredCount = JSON.parse(localStorage.getItem(STORAGE_SOLVED) || "[]").length;
      document.getElementById('review-info').innerHTML = `💡 총 ${totalQuestionsCount}문제 중 <strong>${masteredCount}문제를 완전 통과</strong>하셨습니다.`;

      if (currentPlayStage === 'base') {
        localStorage.setItem(STORAGE_DAILY_STAGE, 'base_done');
        document.getElementById('bonus-action-area').style.display = 'block';
      } else {
        localStorage.setItem(STORAGE_DAILY_STAGE, 'bonus_done');
        document.getElementById('daily-complete-area').style.display = 'block';
      }
    }

    function getValidDisplayScore() {
      const saved = localStorage.getItem(STORAGE_LAST_SCORE);
      if (saved && parseInt(saved, 10) > 0) return parseInt(saved, 10);
      if (score > 0) return score;
      return 100;
    }

    function triggerShareForBonus() {
      const exp = parseInt(localStorage.getItem(STORAGE_EXP) || "0", 10);
      const rank = getRank(exp);
      const displayScore = getValidDisplayScore();
      const challengeUrl = `${window.location.origin}${window.location.pathname}?r=${rank.id}&s=${displayScore}`;
      
      const shareText = 
`📜 [조선 과거시험 보너스 초대]
나의 품계: [${rank.tag}] ${rank.title} (${displayScore}점 달성)
영토 장악: 조선 8도 중 ${rank.territories.length}도 평정!

"내가 오늘 거둔 성적과 관할지를 넘볼 자가 있는가?"
지금 도전하여 당신의 조선 관직과 영토를 확인하라!

👉 과거시험 치러 가기:
${challengeUrl}`;

      if (navigator.share) {
        navigator.share({
          title: '오늘의 역사 1분 퀴즈',
          text: shareText,
          url: challengeUrl
        })
        .then(() => {
          localStorage.setItem(STORAGE_DAILY_STAGE, 'bonus_unlocked');
          alert('🎉 공유가 완료되어 오늘의 보너스 5문제가 해금되었습니다!');
          location.reload();
        })
        .catch(() => {});
      } else {
        navigator.clipboard.writeText(shareText).then(() => {
          localStorage.setItem(STORAGE_DAILY_STAGE, 'bonus_unlocked');
          alert('🎉 내 품계와 영토 기록이 담긴 링크가 복사되었습니다!\n카카오톡 대화방에 붙여넣어 공유를 완료하면 보너스 5문제가 열립니다.');
          location.reload();
        });
      }
    }

    function shareQuiz() {
      const exp = parseInt(localStorage.getItem(STORAGE_EXP) || "0", 10);
      const rank = getRank(exp);
      const displayScore = getValidDisplayScore();
      const challengeUrl = `${window.location.origin}${window.location.pathname}?r=${rank.id}&s=${displayScore}`;

      const fullShareMessage = 
`📜 [조선 과거시험 급제 통보]
나의 품계: [${rank.tag}] ${rank.title} (${displayScore}점 / 누적 ${exp}문항 급제)
관할 영토: 8도 중 [${rank.territories.length}도 평정] (${rank.desc})

"감히 내 관직과 영토를 넘볼 자가 있는가?"
지금 바로 과거에 응시하여 나와 겨뤄보아라!

👇 과거시험 응시하기
${challengeUrl}`;

      if (navigator.share) {
        navigator.share({
          title: `[조선 과거시험] 나의 품계: ${rank.title}`,
          text: fullShareMessage,
          url: challengeUrl
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(fullShareMessage).then(() => {
          alert(`🎉 [${rank.title}] 품계 및 영토 자랑 문구가 복사되었습니다!\n카카오톡 대화방에 [붙여넣기] 하시면 멋지게 전송됩니다.`);
        });
      }
    }

    fetchQuizFromSheet();
  </script>
