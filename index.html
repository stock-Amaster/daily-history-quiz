<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘의 역사 한 수 | Daily History Quiz</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --correct: #10b981;
      --wrong: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
    }

    /* 상단 헤더 & 프로그레스 바 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }

    .q-count {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.3s ease;
    }

    /* 문제 영역 */
    .question-box {
      margin-bottom: 24px;
    }

    .category {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .question {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.45;
      color: #ffffff;
      word-break: keep-all;
    }

    /* 보기 선택지 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      width: 100%;
      padding: 16px 18px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      background: #273549;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      word-break: keep-all;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: var(--correct) !important;
      color: #34d399 !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--wrong) !important;
      color: #f87171 !important;
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* 3초 감동 해설 카드 */
    .explanation-card {
      display: none;
      background: #182234;
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      padding: 14px 16px;
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    .explanation-card.show {
      display: block;
    }

    .exp-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .exp-text {
      font-size: 0.92rem;
      line-height: 1.5;
      color: #cbd5e1;
      word-break: keep-all;
    }

    /* 다음 버튼 */
    .next-btn {
      display: none;
      width: 100%;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .next-btn:active {
      background: var(--accent-hover);
    }

    /* 최종 결과 화면 */
    .result-screen {
      display: none;
      text-align: center;
      padding: 10px 0;
    }

    .result-badge {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .result-desc {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .score-emojis {
      font-size: 1.8rem;
      letter-spacing: 8px;
      margin-bottom: 24px;
      background: #182234;
      padding: 16px;
      border-radius: 14px;
      border: 1px dashed var(--border);
    }

    .share-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      background: #2563eb;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .share-btn:active {
      background: #1d4ed8;
    }

    .toast {
      visibility: hidden;
      min-width: 200px;
      background-color: #334155;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 10px;
      position: fixed;
      z-index: 10;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
    }

    .toast.show {
      visibility: visible;
      animation: fadeinout 2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeinout {
      0% { opacity: 0; bottom: 20px; }
      20% { opacity: 1; bottom: 30px; }
      80% { opacity: 1; bottom: 30px; }
      100% { opacity: 0; bottom: 20px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 퀴즈 화면 -->
    <div id="quizScreen">
      <div class="header">
        <span class="badge">오늘의 역사 1분</span>
        <span class="q-count" id="qCount">1 / 5</span>
      </div>

      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>

      <div class="question-box">
        <div class="category" id="categoryTitle">사극 속 그 장면</div>
        <div class="question" id="questionText">문제가 여기에 로딩됩니다.</div>
      </div>

      <div class="options" id="optionsContainer">
        <!-- 버튼이 자바스크립트로 생성됨 -->
      </div>

      <div class="explanation-card" id="expCard">
        <div class="exp-title">💡 3초 비하인드 스토리</div>
        <div class="exp-text" id="expText">해설 내용</div>
      </div>

      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제 풀기</button>
    </div>

    <!-- 최종 결과 화면 -->
    <div id="resultScreen" class="result-screen">
      <span class="result-badge" id="resultRank">상위 3% 판정</span>
      <h2 class="result-title" id="resultTitle">조선사 훈장님급 감각!</h2>
      <p class="result-desc" id="resultDesc">어설픈 암기가 아니라 당시의 삶과 맥락을 정확히 꿰뚫고 계시네요.</p>

      <div class="score-emojis" id="emojiResults">
        🟩 🟩 🟩 🟩 🟩
      </div>

      <button class="share-btn" onclick="copyResult()">
        📋 단톡방에 내 결과 복사하기
      </button>

      <p style="font-size:0.8rem; color:#64748b; margin-top:16px;">매일 아침 7시, 새로운 역사 5문제가 찾아옵니다.</p>
    </div>
  </div>

  <div id="toast" class="toast">단톡방 공유 문구가 복사되었습니다!</div>

  <script>
    // 5문제 데이터 (거실에서 가족끼리 헷갈리기 쉬운 실화 중심)
    const quizData = [
      {
        category: "사극 고증 탐구",
        question: "사극에서 세종대왕 수라상에 빨간 배추김치와 매콤한 고추장이 올라왔을까요?",
        options: [
          "왕의 밥상이니 당연히 올라왔다",
          "고추는 임진왜란 이후 들어와 당시엔 없었다"
        ],
        answer: 1,
        exp: "고추는 임진왜란(1592년) 무렵 일본을 통해 전래되었습니다. 세종대왕 시절에는 산초나 마늘, 소금으로 절인 백김치를 드셨습니다."
      },
      {
        category: "동시대 인물 미스터리",
        question: "영화 <광해>의 광해군과 <명량>의 이순신 장군은 실제로 같은 시대를 살았을까요?",
        options: [
          "완전히 다른 세기의 인물들이다",
          "선조 때 광해군이 세자로서 이순신을 직접 격려한 동시대 영웅이다"
        ],
        answer: 1,
        exp: "임진왜란 당시 열여덟 살의 세자 광해군은 조정을 둘로 나눈 '분조'를 이끌며 전방에서 군량과 군사를 모았고, 이순신 장군에게 관직과 격려를 보낸 실존 동시대 동지였습니다."
      },
      {
        category: "기적의 실화",
        question: "한국전쟁 흥남철수 작전 당시, 14,000명의 피란민을 태운 메러디스 빅토리호는 배 안의 무엇을 바다에 버렸을까요?",
        options: [
          "피란민들이 마실 식수와 식량",
          "배에 실려 있던 250톤의 대포와 폭탄 무기"
        ],
        answer: 1,
        exp: "레너드 라루 선장은 한 명의 목숨이라도 더 태우기 위해 배의 모든 무기를 바다에 버렸습니다. 단 한 명의 희생도 없이 14,000명이 살아남아 '크리스마스의 기적'으로 불립니다."
      },
      {
        category: "궁궐 비하인드",
        question: "조선시대 왕들의 평균 수명은 환갑(60세)을 넘겼을까요?",
        options: [
          "최고의 의술과 보약을 먹어 70세를 넘겼다",
          "격무와 운동 부족 등으로 평균 40대 중반에 머물렀다"
        ],
        answer: 1,
        exp: "조선 왕 27명의 평균 수명은 약 46.1세였습니다. 하루 14시간 이상의 격무, 극심한 스트레스, 운동 부족으로 영조(83세) 같은 예외를 빼면 환갑을 넘기기 매우 힘들었습니다."
      },
      {
        category: "숨겨진 역사적 장면",
        question: "1945년 8월 15일 정오 광복 당일, 서울 시내는 즉시 만세 함성으로 뒤덮였을까요?",
        options: [
          "라디오 음질이 조악하고 일본어 방송이라 다음 날(16일)부터 쏟아져 나왔다",
          "정오 방송 직후 전 국민이 태극기를 들고 즉시 거리로 뛰어나왔다"
        ],
        answer: 0,
        exp: "히로히토 일왕의 항복 방송 음질이 매우 거칠었고 어려운 궁중 일본어여서 당일 낮에는 무슨 뜻인지 모르는 이가 많았습니다. 소식이 제대로 전파된 8월 16일 아침부터 폭발적인 만세 행렬이 이어졌습니다."
      }
    ];

    let currentQ = 0;
    let score = 0;
    let userAnswers = [];

    const qCountEl = document.getElementById("qCount");
    const progressFillEl = document.getElementById("progressFill");
    const categoryTitleEl = document.getElementById("categoryTitle");
    const questionTextEl = document.getElementById("questionText");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const expCardEl = document.getElementById("expCard");
    const expTextEl = document.getElementById("expText");
    const nextBtnEl = document.getElementById("nextBtn");

    function loadQuestion() {
      const q = quizData[currentQ];
      qCountEl.innerText = `${currentQ + 1} / ${quizData.length}`;
      progressFillEl.style.width = `${((currentQ + 1) / quizData.length) * 100}%`;
      categoryTitleEl.innerText = q.category;
      questionTextEl.innerText = q.question;

      optionsContainerEl.innerHTML = "";
      expCardEl.classList.remove("show");
      nextBtnEl.style.display = "none";

      q.options.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span>${index + 1}. ${optText}</span>`;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainerEl.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
      const q = quizData[currentQ];
      const allBtns = optionsContainerEl.querySelectorAll(".option-btn");

      // 모든 버튼 비활성화
      allBtns.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        selectedBtn.classList.add("correct");
        score++;
        userAnswers.push("🟩");
      } else {
        selectedBtn.classList.add("wrong");
        allBtns[q.answer].classList.add("correct");
        userAnswers.push("🟥");
      }

      // 해설 노출
      expTextEl.innerText = q.exp;
      expCardEl.classList.add("show");

      // 다음 버튼 활성화
      if (currentQ < quizData.length - 1) {
        nextBtnEl.innerText = "다음 문제 풀기";
      } else {
        nextBtnEl.innerText = "내 최종 결과 보기";
      }
      nextBtnEl.style.display = "block";
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quizScreen").style.display = "none";
      const resultScreen = document.getElementById("resultScreen");
      resultScreen.style.display = "block";

      const emojiStr = userAnswers.join(" ");
      document.getElementById("emojiResults").innerText = emojiStr;

      const rankBadge = document.getElementById("resultRank");
      const resTitle = document.getElementById("resultTitle");
      const resDesc = document.getElementById("resultDesc");

      if (score === 5) {
        rankBadge.innerText = "상위 1% 명예의 전당";
        resTitle.innerText = "살아있는 조선사 실록급!";
        resDesc.innerText = "단 한 문제도 빗나가지 않았습니다. 당시의 시대상과 사람들의 마음을 완벽히 꿰뚫고 계시네요.";
      } else if (score >= 3) {
        rankBadge.innerText = "상위 15% 교양 지식인";
        resTitle.innerText = "사극 마니아 훈장님급!";
        resDesc.innerText = "어설픈 상식이 아니라 맥락을 알고 계십니다. 단톡방에 던져 친구들 실력을 테스트해 보세요.";
      } else {
        rankBadge.innerText = "상위 45% 잠재적 역사가";
        resTitle.innerText = "따뜻한 역사 애호가!";
        resDesc.innerText = "역사는 정답보다 그 시절 사람들의 삶을 느끼는 게 먼저죠. 오늘 3분 비하인드 지식 충전 완료!";
      }
    }

    function copyResult() {
      const shareText = `[오늘의 역사 1분 퀴즈]\n결과: ${userAnswers.join(" ")} (${score}/5 정답)\n${document.getElementById("resultTitle").innerText}\n\n👉 너도 이거 몇 개 맞히나 풀어봐:\nhttps://daily-history-quiz.vercel.app`;

      navigator.clipboard.writeText(shareText).then(() => {
        const toast = document.getElementById("toast");
        toast.className = "toast show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2000);
      });
    }

    // 초기 실행
    loadQuestion();
  </script>
</body>
</html>
