<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>조선 과거시험: 8도 영토 정복기</title>
  
  <!-- 카카오톡 & SNS 공유 오픈그래프 (OG 태그) -->
  <meta property="og:title" content="조선 과거시험: 전국 8도 역사 정복전">
  <meta property="og:description" content="상위 1%만 통과한다는 조선 과거시험! 당신의 역사 품계는 정1품 영의정일까?">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg-color: #f7f3e8;
      --paper-color: #fffef9;
      --ink-color: #2c251e;
      --border-color: #8c7355;
      --point-color: #b22222;
      --gold-color: #d4af37;
      --accent-color: #3f6844;
      --font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--ink-color);
      font-family: var(--font-family);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 상단 헤더 & 품계 뱃지 */
    header {
      background: var(--paper-color);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    h1 {
      font-size: 1.35rem;
      color: var(--point-color);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .rank-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 10px;
      padding: 8px 12px;
      background: #f1ede2;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .rank-badge {
      color: var(--point-color);
      display: inline-block;
      padding: 2px 8px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    /* 조선 8도 평정 진행도 */
    .map-status-card {
      background: var(--paper-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
    }

    .map-status-title {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .province-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .p-tag {
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
      border: 1px solid #ccc;
      color: #999;
      background: #fafafa;
    }

    .p-tag.conquered {
      border-color: var(--point-color);
      background: #ffe8e8;
      color: var(--point-color);
      font-weight: bold;
    }

    /* 퀴즈 박스 (과거 시험지 스타일) */
    .quiz-card {
      background: var(--paper-color);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
      position: relative;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: #777;
    }

    .quiz-category {
      background: var(--border-color);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: bold;
    }

    .quiz-question {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 18px;
      color: #1a1a1a;
      word-break: keep-all;
    }

    /* 힌트 버튼 (난이도 3 전용) */
    .hint-container {
      margin-bottom: 16px;
      display: none;
    }

    .btn-hint {
      background: #fbf7ee;
      border: 1px dashed var(--border-color);
      color: #8c7355;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      width: 100%;
      justify-content: center;
    }

    .hint-content {
      display: none;
      margin-top: 8px;
      padding: 10px;
      background: #fdf6e2;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #634a00;
      border-left: 3px solid #d4af37;
    }

    /* 선택지 버튼 (2지선다) */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-option {
      background: #fff;
      border: 2px solid #dcd3c1;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink-color);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-option:active {
      transform: scale(0.98);
    }

    .btn-option.correct {
      background: #e8f5e9 !important;
      border-color: #2e7d32 !important;
      color: #1b5e20 !important;
    }

    .btn-option.wrong {
      background: #ffebee !important;
      border-color: #c62828 !important;
      color: #b71c1c !important;
    }

    /* 실시간 해설창 */
    .explanation-box {
      margin-top: 16px;
      padding: 14px;
      background: #f9f6ed;
      border-left: 4px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
      word-break: keep-all;
    }

    .btn-next {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background: var(--point-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    /* 결과 모달창 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: var(--paper-color);
      border: 3px solid var(--point-color);
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.4rem;
      color: var(--point-color);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .score-summary {
      font-size: 1.1rem;
      margin: 14px 0;
      font-weight: bold;
    }

    .rank-up-alert {
      background: #fff8e1;
      border: 1px solid #ffd54f;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #8d6e63;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    /* 하이패스 무제한 버튼 스타일 */
    .btn-hipass {
      background: #1e272e;
      color: #ffd32a;
      border: 2px solid #ffd32a;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }

    .btn-hipass:active {
      transform: scale(0.98);
    }

    .btn-share {
      background: #fae100;
      color: #371d1e;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    .loader {
      text-align: center;
      padding: 40px;
      font-weight: bold;
      color: #777;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📜 조선 과거시험: 영토 평정전</h1>
    <div class="rank-bar">
      <div>현재 품계: <span id="user-rank" class="rank-badge">종9품 참봉</span></div>
      <div>평정 점수: <span id="user-score" style="color:var(--point-color);">0</span>점</div>
    </div>
  </header>

  <!-- 8도 점령 현황 카드 -->
  <div class="map-status-card">
    <div class="map-status-title">
      <span>🗺️ 전국 8도 평정 상태</span>
      <span id="conquered-count" style="color: var(--point-color);">0 / 8도 평정</span>
    </div>
    <div class="province-tags" id="province-list">
      <span class="p-tag" data-p="0">경기도</span>
      <span class="p-tag" data-p="1">충청도</span>
      <span class="p-tag" data-p="2">전라도</span>
      <span class="p-tag" data-p="3">경상도</span>
      <span class="p-tag" data-p="4">강원도</span>
      <span class="p-tag" data-p="5">황해도</span>
      <span class="p-tag" data-p="6">평안도</span>
      <span class="p-tag" data-p="7">함경도</span>
    </div>
  </div>

  <!-- 퀴즈 영역 -->
  <div class="quiz-card" id="quiz-box">
    <div id="loading" class="loader">구글 시트에서 700문항을 불러오는 중...</div>
    
    <div id="quiz-content" style="display: none;">
      <div class="quiz-meta">
        <span class="quiz-category" id="q-category">분류</span>
        <span id="q-progress">문항 1 / 5</span>
      </div>

      <div class="quiz-question" id="q-text">질문이 여기에 표시됩니다.</div>

      <!-- 힌트 버튼 (난이도 3 전용) -->
      <div class="hint-container" id="hint-wrapper">
        <button class="btn-hint" onclick="toggleHint()">
          📜 암행어사 밀서 (난이도 3 특별 힌트 보기)
        </button>
        <div class="hint-content" id="hint-text"></div>
      </div>

      <!-- 2지선다 버튼 -->
      <div class="options-grid">
        <button class="btn-option" onclick="selectAnswer(1)">
          <span id="opt-1-text">보기 1</span>
        </button>
        <button class="btn-option" onclick="selectAnswer(2)">
          <span id="opt-2-text">보기 2</span>
        </button>
      </div>

      <!-- 정답 해설 -->
      <div class="explanation-box" id="explanation"></div>

      <!-- 다음 문항 버튼 -->
      <button class="btn-next" id="next-btn" onclick="nextQuestion()">다음 문항으로 ➜</button>
    </div>
  </div>
</div>

<!-- 과거시험 결과 모달 -->
<div class="modal-overlay" id="result-modal">
  <div class="modal-content">
    <div class="modal-title">🏁 과거시험 채점 결과</div>
    <div class="score-summary" id="modal-score-text">5문제 중 5문제 급제!</div>
    <div class="rank-up-alert" id="modal-rank-alert">축하합니다! 새로운 관직에 제수되었습니다.</div>
    
    <div class="modal-actions">
      <!-- 🔥 무한 하이패스 버튼 (공유나 리셋 없이 즉시 다음 5문제) -->
      <button class="btn-hipass" onclick="continueHiPass()">
        ⚡ 쉼 없는 과거시험 (공유 없이 다음 5문제 즉시 도전)
      </button>

      <!-- 친구 공유 버튼 -->
      <button class="btn-share" onclick="shareQuiz()">
        📢 시험지 카톡 공유하고 영토 자랑하기
      </button>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // [1] 구글 스프레드시트 CSV 게시 URL 연동
  // ==========================================
  // 대표님의 구글 시트 웹 게시(CSV) 링크를 입력하시면 자동으로 700문항을 긁어옵니다.
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCk8l_x6G46qZ9oF-nEAEw53-2kXyR2d8K87lQ/pub?gid=0&single=true&output=csv";

  // 품계 테이블 (점수에 따라 자동 승급)
  const RANKS = [
    { score: 0, title: "평민 (과거 준비생)" },
    { score: 20, title: "종9품 참봉" },
    { score: 50, title: "정8품 사서" },
    { score: 90, title: "종7품 박사" },
    { score: 140, title: "정6품 전적" },
    { score: 200, title: "정5품 홍문관 교리" },
    { score: 270, title: "종4품 서해도 군수" },
    { score: 350, title: "정3품 당상관 동부승지" },
    { score: 440, title: "종2품 경기 관찰사" },
    { score: 540, title: "정2품 판서" },
    { score: 650, title: "정1품 영의정 (천하통일)" }
  ];

  // 상태 변수
  let allQuestions = [];
  let currentBatch = [];
  let currentIndex = 0;
  let batchCorrectCount = 0;
  let totalScore = parseInt(localStorage.getItem('user_history_score') || '0');
  let solvedIndexes = new Set(JSON.parse(localStorage.getItem('solved_indices') || '[]'));
  let audioCtx = null;

  // ==========================================
  // [2] Web Audio 국악 실록 효과음 (팡파레)
  // ==========================================
  function playFanfare(isSuccess) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      if (isSuccess) {
        // 급제 팡파레 (징소리와 나팔 화음)
        [330, 392, 440, 523, 659].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);
          gain.gain.setValueAtTime(0.2, now + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.6);
        });
      } else {
        // 낙방 효과음 (낮은 징 여운)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    } catch(e) {
      // AudioContext 제한 브라우저 대비 무음 처리
    }
  }

  // ==========================================
  // [3] 초기 구글 시트 데이터 로드
  // ==========================================
  async function initData() {
    try {
      const response = await fetch(SHEET_CSV_URL);
      const csvText = await response.text();
      parseCSV(csvText);
      updateProfileUI();

      if (allQuestions.length === 0) {
        loadFallbackQuestions();
      }

      startNewBatch();
    } catch (err) {
      console.warn("구글 시트 연동 대기 중 - 내장 기본 문제로 가동합니다.", err);
      loadFallbackQuestions();
      updateProfileUI();
      startNewBatch();
    }
  }

  // CSV 파서 (따옴표, 탭, 쉼표 대응)
  function parseCSV(text) {
    const lines = text.split(/\r\n|\n/);
    allQuestions = [];

    // 1행은 헤더이므로 생략 (i = 1)
    for (let i = 1; i < lines.length; i++) {
      const row = lines[i];
      if (!row || !row.trim()) continue;

      let cols = [];
      if (row.includes('\t')) {
        cols = row.split('\t');
      } else {
        cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      }

      cols = cols.map(c => c ? c.replace(/^"|"$/g, '').trim() : '');

      if (cols.length >= 5 && cols[1]) {
        allQuestions.push({
          category: cols[0] || '역사 일반',
          question: cols[1],
          opt1: cols[2],
          opt2: cols[3],
          ans: parseInt(cols[4]) || 1,
          explanation: cols[5] || '상세 해설이 등록되어 있지 않습니다.',
          level: parseInt(cols[6]) || 1,
          originalIndex: i - 1
        });
      }
    }
  }

  // 예비용 문항
  function loadFallbackQuestions() {
    allQuestions = [
      { category: '조선 왕실', question: '조선시대 왕의 얼굴을 그린 초상화를 부르던 공식 명칭은?', opt1: '어진', opt2: '의궤', ans: 1, explanation: '왕의 얼굴은 어진(御眞)이라 칭하며 주탑화사가 주관하여 그렸습니다.', level: 1, originalIndex: 0 },
      { category: '삼국 영웅', question: '고구려 광개토대왕이 우리나라 최초로 독자 사용한 연호는?', opt1: '영락', opt2: '건원', ans: 1, explanation: '영원한 즐거움을 뜻하는 영락(永樂) 연호를 사용하여 천하관을 선포했습니다.', level: 2, originalIndex: 1 },
      { category: '고려 왕조', question: '고려 숙종 때 은 한 근으로 한반도 지형을 본떠 만든 고액 은돈은?', opt1: '활구(은병)', opt2: '상평통보', ans: 1, explanation: '입구가 넓은 호병 모양의 활구는 귀족 관료들의 고액 거래용 은돈이었습니다.', level: 3, originalIndex: 2 },
      { category: '조선 생활', question: '조선시대 엽전이 시중에 마르고 화폐 유통이 중단되던 현상은?', opt1: '전황', opt2: '사재기', ans: 1, explanation: '상평통보를 창고에 쌓아두어 유통이 마르는 것을 전황(錢荒)이라 했습니다.', level: 3, originalIndex: 3 },
      { category: '근현대사', question: '1940년 대한민국 임시정부가 충칭에서 창설한 정규 국방군은?', opt1: '한국광복군', opt2: '별기군', ans: 1, explanation: '한국광복군은 총사령 이청천, 참모장 이범석을 중심으로 결성된 정규군입니다.', level: 2, originalIndex: 4 }
    ];
  }

  // ==========================================
  // [4] 하이패스 5문항 선정 및 무한 출제 로직
  // ==========================================
  function startNewBatch() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('quiz-content').style.display = 'block';

    // 푼 적 없는 문제들만 추리기
    let available = allQuestions.filter(q => !solvedIndexes.has(q.originalIndex));

    // 700문항을 전부 푼 경우 자동 초기화
    if (available.length < 5) {
      alert("장원급제! 준비된 모든 과거 문제를 섭렵하셨습니다. 문제를 처음부터 다시 섞습니다.");
      solvedIndexes.clear();
      localStorage.removeItem('solved_indices');
      available = [...allQuestions];
    }

    // 무작위 5문항 셔플 추출
    available.sort(() => 0.5 - Math.random());
    currentBatch = available.slice(0, 5);

    currentIndex = 0;
    batchCorrectCount = 0;
    renderQuestion();
  }

  // 1문항 렌더링
  function renderQuestion() {
    const q = currentBatch[currentIndex];
    document.getElementById('q-category').innerText = q.category;
    document.getElementById('q-progress').innerText = `문항 ${currentIndex + 1} / 5`;
    document.getElementById('q-text').innerText = q.question;
    document.getElementById('opt-1-text').innerText = q.opt1;
    document.getElementById('opt-2-text').innerText = q.opt2;

    // 힌트 처리 (난이도 3 전용)
    const hintWrapper = document.getElementById('hint-wrapper');
    const hintText = document.getElementById('hint-text');
    hintText.style.display = 'none';

    if (q.level === 3) {
      hintWrapper.style.display = 'block';
      // 해설의 첫 문장을 힌트로 제공
      const hintSummary = q.explanation.split('.')[0] + '...';
      hintText.innerText = `💡 [암행어사 밀서]: ${hintSummary}`;
    } else {
      hintWrapper.style.display = 'none';
    }

    // 버튼 초기화
    const btns = document.querySelectorAll('.btn-option');
    btns.forEach(b => {
      b.className = 'btn-option';
      b.disabled = false;
    });

    document.getElementById('explanation').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
  }

  // 힌트 열기/닫기 토글
  function toggleHint() {
    const hintText = document.getElementById('hint-text');
    hintText.style.display = (hintText.style.display === 'block') ? 'none' : 'block';
  }

  // ==========================================
  // [5] 정답 판정 및 실시간 점수 반영
  // ==========================================
  function selectAnswer(userPick) {
    const q = currentBatch[currentIndex];
    const btns = document.querySelectorAll('.btn-option');
    btns.forEach(b => b.disabled = true);

    const isCorrect = (userPick === q.ans);
    playFanfare(isCorrect);

    if (isCorrect) {
      btns[userPick - 1].classList.add('correct');
      totalScore += 10;
      batchCorrectCount++;
    } else {
      btns[userPick - 1].classList.add('wrong');
      btns[q.ans - 1].classList.add('correct');
    }

    // 푼 문제 인덱스 저장 (하이패스 중복 출제 원천 차단)
    solvedIndexes.add(q.originalIndex);
    localStorage.setItem('solved_indices', JSON.stringify(Array.from(solvedIndexes)));
    localStorage.setItem('user_history_score', totalScore.toString());

    // 해설 표시
    const expBox = document.getElementById('explanation');
    expBox.innerHTML = `<strong>${isCorrect ? '✅ 급제 (정답)!' : '❌ 낙방 (오답)!'}</strong><br>${q.explanation}`;
    expBox.style.display = 'block';

    updateProfileUI();

    const nextBtn = document.getElementById('next-btn');
    if (currentIndex < 4) {
      nextBtn.innerText = "다음 문제 풀기 ➜";
    } else {
      nextBtn.innerText = "🏁 채점 결과 및 과거 급제 확인";
    }
    nextBtn.style.display = 'block';
  }

  function nextQuestion() {
    if (currentIndex < 4) {
      currentIndex++;
      renderQuestion();
    } else {
      showResultModal();
    }
  }

  // ==========================================
  // [6] 결과 모달 및 무한 하이패스 전환
  // ==========================================
  function showResultModal() {
    const modal = document.getElementById('result-modal');
    const scoreText = document.getElementById('modal-score-text');
    const rankAlert = document.getElementById('modal-rank-alert');

    scoreText.innerText = `이번 과거 5문제 중 ${batchCorrectCount}문제 급제! (+${batchCorrectCount * 10}점)`;
    
    const rankObj = getRankTitle(totalScore);
    rankAlert.innerHTML = `현재 관직: <strong>${rankObj.title}</strong><br>총 평정 점수: ${totalScore}점`;

    modal.style.display = 'flex';
  }

  // 🔥 핵심: 공유 없이 다음 5문제를 즉시 로딩하는 하이패스 함수
  function continueHiPass() {
    document.getElementById('result-modal').style.display = 'none';
    startNewBatch();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // 카카오톡 / 외부 공유
  function shareQuiz() {
    const shareText = `[조선 과거시험] 나의 품계는 '${getRankTitle(totalScore).title}' (${totalScore}점)! 당신도 전국 8도를 정복할 수 있겠소?`;
    if (navigator.share) {
      navigator.share({
        title: '조선 과거시험: 영토 평정전',
        text: shareText,
        url: window.location.href
      }).catch(() => {});
    } else {
      navigator.clipboard.writeText(`${shareText}\n${window.location.href}`).then(() => {
        alert("시험지 링크가 복사되었습니다. 단톡방에 붙여넣어 겨뤄보세요!");
      });
    }
  }

  // 품계 및 8도 점령 UI 업데이트
  function updateProfileUI() {
    document.getElementById('user-score').innerText = totalScore;
    const rank = getRankTitle(totalScore);
    document.getElementById('user-rank').innerText = rank.title;

    // 50점마다 1개 도씩 평정 (최대 8도)
    const conquered = Math.min(8, Math.floor(totalScore / 50));
    document.getElementById('conquered-count').innerText = `${conquered} / 8도 평정`;

    const tags = document.querySelectorAll('.p-tag');
    tags.forEach((tag, idx) => {
      if (idx < conquered) {
        tag.classList.add('conquered');
      } else {
        tag.classList.remove('conquered');
      }
    });
  }

  function getRankTitle(score) {
    let current = RANKS[0];
    for (let r of RANKS) {
      if (score >= r.score) current = r;
      else break;
    }
    return current;
  }

  // 실행 진입
  window.addEventListener('DOMContentLoaded', initData);
</script>
</body>
</html>
