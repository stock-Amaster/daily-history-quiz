  <!-- [추후 구글 애드센스 승인 스크립트 들어갈 자리] -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .ad-container {
      width: 100%;
      max-width: 440px;
      margin: 12px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .ad-placeholder {
      width: 100%;
      min-height: 80px;
      border: 1px dashed #334155;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-size: 13px;
      background-color: rgba(30, 41, 59, 0.4);
      letter-spacing: -0.3px;
    }

    .quiz-container {
      background-color: #1e293b;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background-color: #0284c7;
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 9999px;
    }

    .progress-text {
      font-size: 14px;
      color: #38bdf8;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: #334155;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    .category-title {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .question-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      color: #f1f5f9;
      margin-top: 4px;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #27354a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background-color: #334155;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background-color: #059669 !important;
      border-color: #34d399 !important;
      color: #ffffff !important;
    }

    .option-btn.wrong {
      background-color: #dc2626 !important;
      border-color: #f87171 !important;
      color: #ffffff !important;
    }

    .explanation-box {
      display: none;
      background-color: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .next-btn {
      display: none;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .result-box {
      display: none;
      text-align: center;
      padding: 10px 0;
    }

    .result-score {
      font-size: 42px;
      font-weight: 800;
      color: #38bdf8;
      margin: 10px 0;
    }

    .share-btn {
      background-color: #fee500;
      color: #191919;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="ad-container" id="ad-top">
    <div class="ad-placeholder">광고 배너 영역 (상단)</div>
  </div>

  <div class="quiz-container">
    <div id="quiz-area">
      <div class="top-bar">
        <span class="badge">오늘의 역사 1분</span>
        <span class="progress-text" id="progress-text">1 / 5</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div style="margin-top: 10px;">
        <div class="category-title" id="category-title">문제 불러오는 중...</div>
        <div class="question-title" id="question-title">문제를 가져오고 있습니다. 잠시만 기다려주세요.</div>
      </div>

      <div class="options-group" id="options-group" style="margin-top: 16px;"></div>
      <div class="explanation-box" id="explanation-box"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 문제 풀기</button>
    </div>

    <!-- 결과 화면 -->
    <div class="result-box" id="result-box">
      <div class="badge" style="display:inline-block; margin-bottom: 8px;">오늘의 퀴즈 완주!</div>
      <h2 style="font-size: 22px; font-weight: 700;">내 역사 상식 점수는?</h2>
      <div class="result-score" id="final-score">0점</div>
      <p id="result-comment" style="color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 20px;"></p>
      <button class="share-btn" onclick="shareQuiz()">카카오톡으로 친구에게 공유하기</button>
      <button class="next-btn" style="display:block; margin-top: 10px; background: #334155;" onclick="location.reload()">새로운 문제 다시 풀기</button>
    </div>
  </div>

  <div class="ad-container" id="ad-bottom">
    <div class="ad-placeholder">광고 배너 영역 (하단)</div>
  </div>

  <script>
    // 구글 스프레드시트 웹 게시 CSV 링크
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRLOa1x96Z9qxzRC5qoSj8JDxd81XHIiwueBp7W97MZcy6MbRfcBNN8eeenJuLZs7sECaoSIQN-PMRC/pub?output=csv";

    // 1회 접속 시 풀 문제 수 (기본 5문제)
    const QUIZ_COUNT = 5;

    let quizData = [];
    let currentIdx = 0;
    let score = 0;
    let isAnswered = false;

    // CSV 파서 (쉼표와 따옴표가 섞인 긴 해설도 깨짐 없이 분리)
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentVal.trim());
          if (currentRow.some(col => col.length > 0)) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal.length > 0 || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(col => col.length > 0)) {
          rows.push(currentRow);
        }
      }
      return rows;
    }

    // 구글 시트에서 문제 실시간 로드
    async function fetchQuizFromSheet() {
      try {
        const response = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const allQuestions = [];
        // 0행은 헤더(제목줄)이므로 1행부터 읽음
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 5) continue;

          const category = row[0] || "역사 상식";
          const question = row[1];
          const opt1 = row[2];
          const opt2 = row[3];
          const answerNum = parseInt(row[4], 10);
          const explanation = row[5] || "";

          // 유효한 문제만 등록 (보기가 2개이고 정답이 1 또는 2인 경우)
          if (question && opt1 && opt2 && (answerNum === 1 || answerNum === 2)) {
            allQuestions.push({
              category: category,
              question: question,
              options: [opt1, opt2],
              answer: answerNum - 1, // 0-based index
              explanation: explanation
            });
          }
        }

        if (allQuestions.length === 0) {
          throw new Error("문제 데이터가 없습니다.");
        }

        // 전체 문제 중 무작위로 섞어서 QUIZ_COUNT(5개)만큼 선정
        allQuestions.sort(() => Math.random() - 0.5);
        quizData = allQuestions.slice(0, Math.min(QUIZ_COUNT, allQuestions.length));

        renderQuestion();
      } catch (err) {
        document.getElementById('category-title').innerText = "오류 발생";
        document.getElementById('question-title').innerText = "문제를 불러오지 못했습니다. 잠시 후 다시 접속해 주세요.";
      }
    }

    function renderQuestion() {
      isAnswered = false;
      const data = quizData[currentIdx];

      document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${quizData.length}`;
      document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
      document.getElementById('category-title').innerText = data.category;
      document.getElementById('question-title').innerText = data.question;

      const optionsGroup = document.getElementById('options-group');
      optionsGroup.innerHTML = '';

      data.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${index + 1}. ${optText}`;
        btn.onclick = () => selectOption(index, btn);
        optionsGroup.appendChild(btn);
      });

      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(selectedIndex, btnElement) {
      if (isAnswered) return;
      isAnswered = true;

      const data = quizData[currentIdx];
      const buttons = document.querySelectorAll('.option-btn');
      const pointPerQuestion = Math.round(100 / quizData.length);

      if (selectedIndex === data.answer) {
        btnElement.classList.add('correct');
        score += pointPerQuestion;
      } else {
        btnElement.classList.add('wrong');
        buttons[data.answer].classList.add('correct');
      }

      const expBox = document.getElementById('explanation-box');
      expBox.innerText = data.explanation;
      expBox.style.display = 'block';

      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerText = (currentIdx === quizData.length - 1) ? "결과 보러 가기" : "다음 문제 풀기";
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < quizData.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-area').style.display = 'none';
      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';

      if (score > 100) score = 100;
      document.getElementById('final-score').innerText = `${score}점`;

      let comment = "";
      if (score >= 90) comment = "대단합니다! 조선시대에 태어났다면 장원급제 감이네요!";
      else if (score >= 60) comment = "훌륭합니다! 웬만한 사극 매니아 수준의 역사 상식을 갖추셨군요.";
      else comment = "아쉬워요! 하지만 이제 제대로 된 역사 상식을 알게 되셨습니다!";

      document.getElementById('result-comment').innerText = comment;
    }

    function shareQuiz() {
      if (navigator.share) {
        navigator.share({
          title: '오늘의 역사 1분 퀴즈',
          text: `내 역사 상식 점수는 ${score}점입니다! 당신도 한번 도전해보세요!`,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('퀴즈 주소가 복사되었습니다! 카카오톡 대화방에 붙여넣어 공유하세요.');
      }
    }

    fetchQuizFromSheet();
  </script>
</body>
